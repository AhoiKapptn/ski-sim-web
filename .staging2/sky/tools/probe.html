<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>sky probe</title><style>body{margin:0;background:#111}</style></head>
<body>
<script type="module">
import * as THREE from 'three';
import { createSky } from '/src/world/sky.js';
import { createSnowMaterial } from '/src/world/snow-material.js';

// ---------------------------------------------------------------------------
// Linear-light measurement rig for src/world/sky.js.
// Renders into a float render target, so every number below is scene-linear
// radiance (no tone map, no grade) — the space the review measured in. The
// probe plates use the REAL snow material, so "sunlit snow" here is literally
// the same shader the terrain runs.
// ---------------------------------------------------------------------------
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(1);
renderer.setSize(512, 512);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const sky = createSky(scene, renderer);

function snowPlate(size, aerial) {
  const mat = createSnowMaterial({ rock: false });
  mat.userData.snowUniforms.uAerialDensity.value = aerial ? 0.00042 : 0.0;
  mat.userData.snowUniforms.uSparkle.value = 0.0;   // sparkle is a sparse specular; it biases means
  const m = new THREE.Mesh(new THREE.PlaneGeometry(size, size, 8, 8), mat);
  m.rotation.x = -Math.PI / 2;
  m.receiveShadow = true;
  return m;
}
const snow = snowPlate(400, false);
scene.add(snow);

// A 30-degree snow face, seen head-on. Two copies: one at 30 m with the aerial
// term off (the "near snow" reference) and one 3 km away with terrain.js's
// aerial settings, so the pair isolates exactly what aerial perspective does.
function face(dist, aerial) {
  const m = snowPlate(dist * 1.6, aerial);
  m.rotation.set(-Math.PI / 3, 0, 0);   // 30 deg slope, facing the camera
  m.position.set(0, dist * 0.20, -dist);
  return m;
}
const nearFace = face(30, false);
const ridge = face(3000, true);
scene.add(nearFace); scene.add(ridge);

const white = new THREE.Mesh(new THREE.PlaneGeometry(200, 200),
  new THREE.MeshStandardMaterial({ roughness: 1, metalness: 0 }));
white.material.color.setRGB(1, 1, 1, THREE.LinearSRGBColorSpace);
white.rotation.x = -Math.PI / 2;
white.visible = false;
scene.add(white);

const RS = 48;
const rt = new THREE.WebGLRenderTarget(RS, RS, {
  type: THREE.FloatType, minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
  depthBuffer: true,
});
const buf = new Float32Array(RS * RS * 4);

const ortho = new THREE.OrthographicCamera(-5, 5, 5, -5, 0.1, 200);
const persp = new THREE.PerspectiveCamera(4, 1, 0.5, 90000);

function grab(cam) {
  renderer.setRenderTarget(rt);
  renderer.render(scene, cam);
  renderer.readRenderTargetPixels(rt, 0, 0, RS, RS, buf);
  renderer.setRenderTarget(null);
}
function median(cam) {           // robust to sparkles / noise
  grab(cam);
  const n = buf.length / 4;
  const idx = new Array(n);
  for (let i = 0; i < n; i++) idx[i] = i;
  const lum = (i) => 0.2126 * buf[i * 4] + 0.7152 * buf[i * 4 + 1] + 0.0722 * buf[i * 4 + 2];
  idx.sort((a, b) => lum(a) - lum(b));
  const m = idx[n >> 1];
  return [buf[m * 4], buf[m * 4 + 1], buf[m * 4 + 2]];
}
function mean(cam) {
  grab(cam);
  let r = 0, g = 0, b = 0;
  for (let i = 0; i < buf.length; i += 4) { r += buf[i]; g += buf[i + 1]; b += buf[i + 2]; }
  const n = buf.length / 4;
  return [r / n, g / n, b / n];
}
function max(cam) {
  grab(cam);
  let best = [0, 0, 0], bl = -1;
  for (let i = 0; i < buf.length; i += 4) {
    const l = 0.2126 * buf[i] + 0.7152 * buf[i + 1] + 0.0722 * buf[i + 2];
    if (l > bl) { bl = l; best = [buf[i], buf[i + 1], buf[i + 2]]; }
  }
  return best;
}

function dirFrom(elevDeg, azOffsetDeg) {
  const s = sky.uniforms.uSunDir.value;
  const hl = Math.hypot(s.x, s.z) || 1;
  const ux = s.x / hl, uz = s.z / hl;
  const a = azOffsetDeg * Math.PI / 180;
  const ca = Math.cos(a), sa = Math.sin(a);
  const rx = ux * ca - uz * sa, rz = ux * sa + uz * ca;
  const e = elevDeg * Math.PI / 180;
  return new THREE.Vector3(rx * Math.cos(e), Math.sin(e), rz * Math.cos(e)).normalize();
}
const PLATES = [snow, nearFace, ridge, white];
function only(...on) { for (const p of PLATES) p.visible = on.includes(p); }

function skyAtDir(dir) {
  const vis = PLATES.map((p) => p.visible);
  only();
  persp.fov = 3; persp.updateProjectionMatrix();
  persp.position.set(0, 30, 0);
  persp.lookAt(dir.x * 5000, 30 + dir.y * 5000, dir.z * 5000);
  persp.updateMatrixWorld();
  const v = mean(persp);
  PLATES.forEach((p, i) => { p.visible = vis[i]; });
  return v;
}

// terrain.js drives the snow shader's aerial term from scene.fog; mirror it.
function syncAerial() {
  for (const m of PLATES) {
    const u = m.material.userData.snowUniforms;
    if (!u) continue;
    u.uSunDirW.value.copy(sky.sun.position).normalize();
    u.uAerialColor.value.copy(sky.fog.color).convertSRGBToLinear();
    u.uAerialSun.value.copy(u.uAerialColor.value).lerp(new THREE.Color(1.0, 0.92, 0.78), 0.55);
  }
  ridge.material.userData.snowUniforms.uAerialDensity.value = sky.fog.density * 0.62;
}

function measure(t) {
  sky.setTimeOfDay(t);
  sky.update(1 / 60, null);
  syncAerial();

  ortho.position.set(0, 12, 0);
  ortho.up.set(0, 0, -1);
  ortho.lookAt(0, 0, 0);
  ortho.updateMatrixWorld();

  only(snow);
  const sunlit = median(ortho);

  const keep = sky.sun.intensity;
  sky.sun.intensity = 0;
  const shadowed = median(ortho);            // env + fill only == inside a cast shadow
  only(white);
  const envUp = mean(ortho);                 // albedo-1 lambert -> +Y irradiance colour
  sky.sun.intensity = keep;

  // Identical 30 deg snow faces at 30 m and at 3 km, through terrain.js's
  // aerial-perspective settings. Same shader, same orientation, same light:
  // the only difference between the two numbers is the atmosphere.
  const faceAt = (mesh, dist) => {
    only(mesh);
    persp.fov = 8; persp.updateProjectionMatrix();
    persp.position.set(0, 0, 0);
    persp.lookAt(0, dist * 0.20, -dist);
    persp.updateMatrixWorld();
    const v = median(persp);
    only();
    const bg = mean(persp);
    return [v, bg];
  };
  const [nearV] = faceAt(nearFace, 30);
  const [ridgeV, ridgeSky] = faceAt(ridge, 3000);

  const zen = skyAtDir(new THREE.Vector3(0, 1, 0));
  const horSun = skyAtDir(dirFrom(3.5, 0));
  const horOpp = skyAtDir(dirFrom(3.5, 180));
  const upOpp = skyAtDir(dirFrom(45, 180));

  // sun disc, with the cloud decks switched off so a cumulus crossing the sun
  // cannot masquerade as the disc
  only();
  const cd = sky.uniforms.uCloudDensity.value, ci = sky.uniforms.uCirrus.value;
  sky.uniforms.uCloudDensity.value = 0; sky.uniforms.uCirrus.value = 0;
  const sd = sky.uniforms.uSunDir.value;
  persp.fov = 1.2; persp.updateProjectionMatrix();
  persp.position.set(0, 30, 0);
  persp.lookAt(sd.x * 5000, 30 + sd.y * 5000, sd.z * 5000);
  persp.updateMatrixWorld();
  const disc = max(persp);
  sky.uniforms.uSunDisc.value = 0;
  const aureole = max(persp);                // the sky's own Mie peak, no disc
  sky.uniforms.uSunDisc.value = 1;
  sky.uniforms.uCloudDensity.value = cd; sky.uniforms.uCirrus.value = ci;
  only(snow);

  const terrainAir = sky.fog.color.clone().convertSRGBToLinear();

  const L = (c) => 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
  const br = (c) => c[2] / Math.max(c[0], 1e-6);
  const f4 = (c) => c.map((v) => +v.toFixed(4));

  return {
    tod: t,
    sunElevDeg: +(sky.getSunElevation() * 180 / Math.PI).toFixed(2),
    sunIntensity: +sky.sun.intensity.toFixed(3),
    envIntensity: +scene.environmentIntensity.toFixed(3),
    fillIntensity: +sky.fill.intensity.toFixed(3),
    exposure: +renderer.toneMappingExposure.toFixed(3),
    sunlit: f4(sunlit), sunlitL: +L(sunlit).toFixed(4),
    shadow: f4(shadowed), shadowL: +L(shadowed).toFixed(4), shadowBR: +br(shadowed).toFixed(3),
    ratio: +(L(sunlit) / Math.max(L(shadowed), 1e-6)).toFixed(2),
    stops: +(Math.log2(L(sunlit) / Math.max(L(shadowed), 1e-6))).toFixed(2),
    envUp: f4(envUp), envUpBR: +br(envUp).toFixed(3),
    near: f4(nearV), nearL: +L(nearV).toFixed(4), nearBR: +br(nearV).toFixed(3),
    ridge: f4(ridgeV), ridgeL: +L(ridgeV).toFixed(4), ridgeBR: +br(ridgeV).toFixed(3),
    ridgeSky: f4(ridgeSky), ridgeSkyL: +L(ridgeSky).toFixed(4),
    aureole: f4(aureole), aureoleL: +L(aureole).toFixed(2),
    zenith: f4(zen), zenithBR: +br(zen).toFixed(3),
    horizonSun: f4(horSun), horizonSunL: +L(horSun).toFixed(3),
    horizonOpp: f4(horOpp), horizonOppL: +L(horOpp).toFixed(3),
    upperOpp: f4(upOpp),
    discPeak: f4(disc), discL: +L(disc).toFixed(2),
    terrainAir: f4(terrainAir.toArray()), terrainAirL: +L(terrainAir.toArray()).toFixed(4),
    terrainAirBR: +br(terrainAir.toArray()).toFixed(3),
    fogDensity: sky.fog.density,
  };
}

const out = [];
if (!location.search.includes('views')) {
  for (const t of [0.375, 0.5, 0.30, 0.265]) out.push(measure(t));
}
window.__probe = out;

// --- eyeball views: tone-mapped canvas renders straight at the sun ----------
window.__view = (tod, elevDeg, azDeg, fov) => {
  sky.setTimeOfDay(tod);
  sky.update(1 / 60, null);
  syncAerial();
  only();
  // elevDeg === null: aim straight at the sun
  const d = elevDeg === null
    ? sky.uniforms.uSunDir.value.clone()
    : dirFrom(elevDeg, azDeg);
  const cam = new THREE.PerspectiveCamera(fov, 1, 0.5, 90000);
  cam.position.set(0, 30, 0);
  cam.lookAt(d.x * 5000, 30 + d.y * 5000, d.z * 5000);
  renderer.setRenderTarget(null);
  viewCam = cam;
  renderer.render(scene, cam);
  return true;
};

// The headless compositor only lets Page.captureScreenshot through if the page
// is actually presenting frames, so keep the swap chain alive.
let viewCam = null;
(function present() {
  requestAnimationFrame(present);
  if (viewCam) { renderer.setRenderTarget(null); renderer.render(scene, viewCam); }
})();
window.__probeReady = true;
</script>
</body>
</html>
