<link rel="icon" href="/ski-sim-web/favicon.svg" /><title>Alpine — Ski Simulator</title>
<style>
  html,body{margin:0;height:100%;background:#05070c;overflow:hidden;
    font-family:"Inter","SF Pro Display",-apple-system,system-ui,sans-serif;color:#fff}
  #app{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%}
  #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;

  #bar{width:260px;height:2px;background:#ffffff22;overflow:hidden}
  #bar i{display:block;height:100%;width:0;background:#fff;transition:width .3s}
  #boot span{font-size:11px;letter-spacing:.32em;text-transform:uppercase;opacity:.5}
</style>
